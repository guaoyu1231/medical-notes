<h1>左右肺的分叶与肺裂</h1>
<p>以肺裂为界，对照左右肺的分叶方式。</p>
<h2 id="compare">左右对照</h2>
<table><thead><tr><th>侧别</th><th>肺叶</th><th>肺裂</th></tr></thead><tbody><tr><td>右肺</td><td>上叶、中叶、下叶</td><td>水平裂、斜裂</td></tr><tr><td>左肺</td><td>上叶、下叶</td><td>斜裂</td></tr></tbody></table>
<h2 id="recall">回忆练习</h2>
<p>合上表格，尝试说出哪一侧有中叶，以及该侧的两条肺裂。</p>
<details><summary>展开核对</summary><p>右肺有中叶。右肺的两条肺裂分别是水平裂和斜裂。</p></details>
