<h1>心脏四腔与血流方向</h1>
<p>沿一次完整的循环，依次辨认心房、心室和相连的大血管。</p>
<h2 id="right-heart">从体循环回到右心</h2>
<p>来自体循环的静脉血经上、下腔静脉等途径进入右心房。血液经三尖瓣流入右心室，再经肺动脉瓣进入肺动脉干，流向肺。</p>
<h2 id="left-heart">从肺回到左心</h2>
<p>肺静脉将血液送入左心房。血液经二尖瓣进入左心室，再经主动脉瓣进入主动脉，输送至全身。</p>
<p><mark>动脉和静脉按血液相对心脏的流向命名。</mark>动脉将血液送离心脏，静脉将血液送回心脏。</p>
