<h1>心电图的基本波形</h1>
<p>在一个心动周期中，沿基线依次寻找 P 波、QRS 波群与 T 波。</p>
<h2 id="waveform">沿基线辨认波形</h2>
<p>从一个清楚的 QRS 波群开始，向前寻找 P 波，再向后寻找 T 波。先描述波形，再联系它代表的电活动。</p>
<figure><img src="assets/ecg.webp" width="960" height="320" alt="带有 P、QRS、T 标注的心电波形示意" loading="lazy" /><figcaption>一个心动周期的波形示意，横向表示时间。图形未按临床标尺绘制。</figcaption></figure>
<h2 id="events">波形与电活动</h2>
<table><thead><tr><th>波形</th><th>对应的主要电活动</th></tr></thead><tbody><tr><td>P 波</td><td>心房除极</td></tr><tr><td>QRS 波群</td><td>心室除极</td></tr><tr><td>T 波</td><td>心室复极</td></tr></tbody></table>
<p><mark>心电图记录电活动。</mark>理解波形后，可以再对照心脏泵血笔记，区分电活动与机械活动。</p>
<details><summary>拓展：心房复极在什么位置？</summary><p>心房复极通常与 QRS 波群在时间上重叠，因此常规心电图上往往难以单独辨认。</p></details>
<p>参考阅读：<a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/19-2-cardiac-muscle-and-electrical-activity">OpenStax《Anatomy and Physiology 2e》§19.2</a>。</p>
