<h1>心输出量与每搏输出量</h1>
<p>把一次心搏泵出的血量与一分钟内的心搏次数联系起来。</p>
<h2 id="definition">从一次心搏到一分钟</h2>
<p>每搏输出量是一个心室在一次收缩中射出的血量。心输出量是一个心室每分钟泵出的血量。</p>
<h2 id="units">公式与单位</h2>
<p><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>CO</mi><mo>=</mo><mi>HR</mi><mo>×</mo><mi>SV</mi></mrow></math></p>
<ul><li>HR 指心率，单位为次/分。</li><li>SV 指每搏输出量，单位为毫升/次。</li></ul>
<p>以演算用的 70 次/分与 70 毫升/次为例，二者相乘得 4,900 毫升/分，即 4.9 升/分。</p>
<p>参考阅读：<a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/19-4-cardiac-physiology">OpenStax《Anatomy and Physiology 2e》§19.4</a>。</p>
